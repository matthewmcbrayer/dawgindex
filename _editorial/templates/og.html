<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Barlow:wght@500;600&family=Barlow+Condensed:wght@700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#F4EAD2;color:#131210;font-family:Barlow,sans-serif;position:relative}
.in{position:absolute;left:64px;right:250px;top:60px;bottom:96px;display:flex;flex-direction:column}
.tab{align-self:flex-start;background:#E5463A;color:#fff;font:800 24px/1 "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:10px 18px 9px;transform:rotate(-2deg);transform-origin:left bottom}
.big{font:900 120px/.86 "Big Shoulders Display",sans-serif;text-transform:uppercase;margin-top:28px;letter-spacing:-.005em}
.sub{font:900 56px/.9 "Big Shoulders Display",sans-serif;text-transform:uppercase;margin-top:14px}
.dek{font:500 26px/1.3 Barlow,sans-serif;color:#3B362E;margin-top:22px;max-width:880px}
.sub:empty{display:none}
.logo{position:absolute;right:64px;top:56px;width:150px}
.band{position:absolute;left:0;right:0;bottom:0;height:62px;background:#131210;border-top:6px solid #E5463A;display:flex;justify-content:space-between;align-items:center;padding:0 64px}
.band b{font:800 20px/1 "Barlow Condensed",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#F4EAD2}
.band span{font:600 22px/1 Barlow,sans-serif;color:#F5C030;letter-spacing:.04em}
</style></head><body>
<div class="in"><span class="tab">{{TAB}}</span><div class="big" id="big">{{BIG}}</div><div class="sub" id="sub">{{SUB}}</div><p class="dek" id="dek">{{DEK}}</p></div>
<div class="logo"><svg viewBox="0 -0.8 334.3 126.0" width="100%"><path fill="#131210" fill-rule="evenodd" d="M0,0 H40.9 C51.70,0.00 58.90,10.40 58.90,26.00 V98.1 C58.90,113.70 50.90,124.10 38.90,124.10 H0 Z M26.2,25.3 H29.3 Q32.3,25.3 32.3,28.3 V95.1 Q32.3,98.1 29.3,98.1 H26.2 Z M70.45,0 H105.25 L116.95,124.1 H93.35 L91.55,102.9 H83.25 L81.55,124.1 H59.25 Z M87.45,43 L90.35,77.3 H84.55 Z M110.15,0 H133.35 L136.65,50.8 L140.85,0 H160.9 L164.65,52.4 L167.8,0 H190.25 L180.65,124.1 H156.15 L150.65,77.1 L145.15,124.1 H120.45 Z M189.9,23.2 C189.90,8.98 196.70,-0.50 206.90,-0.50 H228.9 C239.10,-0.50 245.90,8.98 245.90,23.20 V45.1 H220.5 V27.1 A2.6,2.6 0 0 0 215.3,27.1 V96.9 A2.6,2.6 0 0 0 220.5,96.9 V76.3 H217.8 V52.3 H245.9 V124.1 H229.9 V119.2 C229.9,122.6 225.2,124.6 217.5,124.6 H206.9 C196.70,124.60 189.90,115.24 189.90,101.20 Z"/><path fill="#2F64C0" d="M246.2,0.00 H334.28 L323.16,37.57 H252.2 V19.6 C252.2,12 248.6,4 246.2,0.00 Z"/><path fill="#F5C030" d="M252.2,43.27 H321.47 L310.35,80.83 H252.2 Z"/><path fill="#E5463A" d="M252.2,86.53 H308.67 L297.55,124.10 H252.2 Z"/></svg></div>
<div class="band"><b>More than the score.</b><span>dawgindex.com</span></div>
<script>
// shrink the headline, then drop the dek, until everything fits above the footer band
window.fit=function(){var box=document.querySelector('.in'),big=document.getElementById('big'),dek=document.getElementById('dek'),s=120;
 function over(){return box.scrollHeight>box.clientHeight+1||big.scrollWidth>big.clientWidth+1}
 while(over()&&s>64){s-=4;big.style.fontSize=s+'px'}
 if(over())dek.style.display='none';
 while(over()&&s>48){s-=4;big.style.fontSize=s+'px'}};
</script>
</body></html>
