<style>/* DAWG Hoops research briefs in the current DAWG Index look (the V3 site): cream paper and ink,

:root {

  --paper: #F4EAD2; --paper-2: #FBF4E2; --paper-3: #EADFC4; --ink: #131210; --ink-2: #3B362E; --muted: #6E6557;

  /* chart roles */
  --page: var(--paper); --surface: var(--paper-2); --grid: rgba(19, 18, 16, 0.08); --axis: var(--rule-2);
  --focus: var(--ink); --compare: var(--blue); --context: #d3c6a6; --dot: #7d7259; --hl: var(--red);
  --focus-wash: rgba(19, 18, 16, 0.06); --compare-wash: rgba(229, 70, 58, 0.12);
  --display: "Big Shoulders Display", "Arial Narrow", sans-serif;

  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;

:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* ---- masthead (dark, as on the site's home view) ---------------------------------------- */
.mast { background: var(--hc-ink); color: var(--paper); border-bottom: 2px solid var(--hc-line); }

h1.verdict { font: 900 clamp(56px, 9vw, 120px)/0.84 var(--display); text-transform: uppercase; letter-spacing: -0.005em; margin: 0; max-width: 12ch; text-wrap: balance; }

.verdicts a { color: var(--paper); text-underline-offset: 3px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; font-size: 13px; }

/* evidence tags, in the style of the site's EXAMPLE tag */

<script>/* DAWG Hoops brief renderer. Reads the JSON the Python side embedded and draws the page.
   It never computes a statistic: every value it shows was placed in the data by a brief spec
   from saved results. Chart types: dumbbell, intervals, rankbars, stack, scatter, panels.
   Page-level highlight: pick a team or player (click a mark or use the finder) and it is
   picked out in lane blue in every chart that contains it. */
(() => {
  "use strict";
  const D = JSON.parse(document.getElementById("brief-data").textContent);
  const NS = "http://www.w3.org/2000/svg";
  const H = { key: null, label: null };            // the page-level highlight
  const figures = [];                               // redraw functions

  // ---- helpers ---------------------------------------------------------------------------
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  function el(tag, attrs = {}, html) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) if (v !== undefined && v !== null) e.setAttribute(k, v);
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function S(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs || {})) if (v !== undefined && v !== null) e.setAttribute(k, v);
    if (parent) parent.appendChild(e);
    return e;
  }
  function T(parent, x, y, text, attrs = {}) {
    const t = S("text", Object.assign({ x, y }, attrs), parent);
    t.textContent = text;
    return t;
  }
  const minus = (s) => s.replace(/^-/, "−").replace(/ -/g, " −").replace(/\(-/g, "(−");
  function fmt(v, f = {}) {
    if (v === null || v === undefined || Number.isNaN(v)) return "–";
    const d = f.dec === undefined ? 1 : f.dec;
    let s = (v * (f.scale || 1)).toFixed(d);
    if (/^-0\.?0*$/.test(s)) s = s.slice(1);
    if (f.sign && +s > 0) s = "+" + s;
    return minus(s) + (f.suffix || "");
  }
  function fill(t) {
    if (!t) return "";
    return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\{([a-z0-9_]+)\}/g, (m, k) => {
      const f = D.facts[k];
      return f ? `<span class="fact" tabindex="0" data-k="${k}">${esc(minus(f.display))}</span>` : m;
    });
  }
  const color = (tone) => `var(--${tone || "context"})`;
  const ordinal = (n) => `${n}${n % 100 >= 11 && n % 100 <= 13 ? "th" : { 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th"}`;
  const lin = (d0, d1, r0, r1) => { const k = (r1 - r0) / (d1 - d0 || 1); return (v) => r0 + (v - d0) * k; };
  function ticks(a, b, n = 5) {
    const span = b - a, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => span / s <= n) || 10 * mag;
    const out = [];
    for (let v = Math.ceil(a / step - 1e-9) * step; v <= b + 1e-9; v += step) out.push(+v.toFixed(10));
    out.dec = Math.max(0, -Math.floor(Math.log10(step) + 1e-9));
    return out;
  }
  function domainOf(vals, pad = 0.08, include = []) {
    const all = vals.concat(include).filter((v) => v !== null && v !== undefined);
    const lo = Math.min(...all), hi = Math.max(...all), p = (hi - lo || 1) * pad;
    return [lo - p, hi + p];
  }
  function barPath(x0, x1, y, h, r = 4) {
    const w = x1 - x0;
    if (Math.abs(w) < 0.5) return "";
    const rr = Math.min(r, Math.abs(w), h / 2), s = w > 0 ? 1 : -1;
    return `M${x0},${y}H${x1 - s * rr}Q${x1},${y} ${x1},${y + rr}V${y + h - rr}Q${x1},${y + h} ${x1 - s * rr},${y + h}H${x0}Z`;
  }
  const isHl = (k) => k !== undefined && k !== null && H.key === k;

  // ---- tooltip ---------------------------------------------------------------------------
  const tip = el("div", { class: "tip", role: "status" });
  document.body.appendChild(tip);
  function showTip(html, evt) {
    tip.innerHTML = html;
    tip.classList.add("on");
    const r = tip.getBoundingClientRect();
    let x, y;
    if (evt && evt.clientX !== undefined && evt.type !== "focus" && evt.type !== "focusin") { x = evt.clientX + 14; y = evt.clientY + 14; }
    else { const b = evt.target.getBoundingClientRect(); x = b.left; y = b.bottom + 8; }
    if (x + r.width > innerWidth - 8) x = Math.max(8, x - r.width - 28);
    if (y + r.height > innerHeight - 8) y = Math.max(8, y - r.height - 28);
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  const hideTip = () => tip.classList.remove("on");
  function hover(node, html) {
    node.addEventListener("mousemove", (e) => showTip(typeof html === "function" ? html() : html, e));
    node.addEventListener("mouseleave", hideTip);
  }
  document.addEventListener("mouseover", (e) => { const f = e.target.closest && e.target.closest(".fact"); if (f) factTip(f, e); });
  document.addEventListener("mouseout", (e) => { if (e.target.closest && e.target.closest(".fact")) hideTip(); });
  document.addEventListener("focusin", (e) => { if (e.target.classList && e.target.classList.contains("fact")) factTip(e.target, e); });
  document.addEventListener("focusout", hideTip);
  function factTip(node, e) {
    const f = D.facts[node.dataset.k];
    showTip(`<b>${esc(minus(f.display))}</b><span class="src">${esc(f.source)}</span>`, e);
  }

  // ---- highlight -------------------------------------------------------------------------
  const hlListeners = [];
  function setHighlight(key, label) {
    if (key !== null && H.key === key) { key = null; label = null; }
    H.key = key; H.label = label;
    hideTip();
    hlListeners.forEach((f) => f());
    redraw();
  }
  const clickHint = (k) => (k === undefined || k === null ? "" : `<span class="act">${isHl(k) ? "Click to clear" : "Click to pick out in every chart"}</span>`);

  // ---- status badge ----------------------------------------------------------------------
  const ICON = {
    VERIFIED: '<svg width="13" height="13" viewBox="0 0 14 14"><circle cx="7" cy="7" r="7" fill="currentColor"/><path d="M3.8 7.2l2.1 2.1 4.3-4.6" stroke="var(--surface)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    PROVISIONAL: '<svg width="13" height="13" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="7" cy="7" r="2.2" fill="currentColor"/></svg>',
    INCONCLUSIVE: '<svg width="13" height="13" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 1a6 6 0 0 1 0 12z" fill="currentColor"/></svg>',
    UNSUPPORTED: '<svg width="13" height="13" viewBox="0 0 14 14"><circle cx="7" cy="7" r="7" fill="currentColor"/><path d="M4.6 4.6l4.8 4.8M9.4 4.6l-4.8 4.8" stroke="var(--surface)" stroke-width="1.8" stroke-linecap="round"/></svg>',
  };
  const WORD = { VERIFIED: "Verified", PROVISIONAL: "Provisional", INCONCLUSIVE: "Inconclusive", UNSUPPORTED: "Unsupported" };
  function badge(c) {
    const s = el("span", { class: `status ${c.status}`, tabindex: "0" }, WORD[c.status]);
    const html = `<b>${WORD[c.status]}</b> ${esc(c.why || "")}<span class="src">${esc(c.source || "")}</span>`;
    hover(s, html);
    s.addEventListener("focus", (e) => showTip(html, e));
    return s;
  }

  // ---- chart types -----------------------------------------------------------------------
  const R = {};
  function labelLayout(W, rows) {
    const longest = Math.max(...rows.map((r) => (r.label || "").length));
    const stacked = W < 560;
    return { stacked, labelW: stacked ? 0 : Math.min(Math.max(150, longest * 7.6 + 18), W * 0.36) };
  }

  R.dumbbell = function (v, host, W, ctx) {
    const f = v.fmt || {};
    const { stacked, labelW } = labelLayout(W, v.rows);
    const rowH = stacked ? 72 : ctx.hero ? 70 : 56, top = 10, right = W < 480 ? 64 : 96;
    const H_ = top + v.rows.length * rowH + 36;
    const svg = S("svg", { viewBox: `0 0 ${W} ${H_}`, role: "img", "aria-label": v.aria || "" }, host);
    const [d0, d1] = v.domain || domainOf(v.rows.flatMap((r) => [r.from, r.to]), 0.3);
    const x = lin(d0, d1, labelW + 14, W - right);
    const tk = ticks(d0, d1, W < 480 ? 4 : 6);
    for (const t of tk) {
      S("line", { class: "grid", x1: x(t), x2: x(t), y1: top, y2: H_ - 30 }, svg);
      T(svg, x(t), H_ - 10, fmt(t, { dec: f.tickDec ?? tk.dec, suffix: f.tickSuffix || "" }), { "text-anchor": "middle", class: "muted" });
    }
    v.rows.forEach((r, i) => {
      const y0 = top + i * rowH, cy = y0 + (stacked ? 46 : rowH / 2);
      const g = S("g", { class: "row" }, svg);
      S("rect", { class: "row-hover", x: 0, y: y0 + 2, width: W, height: rowH - 4, rx: 8 }, g);
      T(g, 0, stacked ? y0 + 20 : cy + 5, r.label, { class: "lbl" + (r.focus ? " focus" : "") });
      const c = color(r.tone);
      S("line", { x1: x(r.from), x2: x(r.to), y1: cy, y2: cy, style: `stroke:${c};stroke-width:${ctx.hero ? 3.5 : 2.5};stroke-linecap:round` }, g);
      S("circle", { cx: x(r.from), cy, r: ctx.hero ? 7.5 : 6, style: `fill:var(--surface);stroke:${c};stroke-width:2.5` }, g);
      S("circle", { cx: x(r.to), cy, r: ctx.hero ? 9 : 7.5, style: `fill:${c};stroke:var(--surface);stroke-width:2` }, g);
      const up = r.to >= r.from;
      T(g, x(r.from) + (up ? -14 : 14), cy + 5, fmt(r.from, f), { "text-anchor": up ? "end" : "start", class: "muted" });
      T(g, x(r.to) + (up ? 15 : -15), cy + 5, fmt(r.to, f), { "text-anchor": up ? "start" : "end", class: "val" });
      if (r.change_label) T(g, W, cy + 6, r.change_label, { "text-anchor": "end", class: ctx.hero ? "big" : "val" });
      S("rect", { class: "hit", x: 0, y: y0, width: W, height: rowH }, g);
      hover(g, `<b>${esc(r.label)}</b><br>${esc(v.from_label)}: ${fmt(r.from, f)}<br>${esc(v.to_label)}: ${fmt(r.to, f)}` +
        (r.change_label ? `<br>Change: ${esc(r.change_label)}` : "") + (r.n ? `<br>${esc(r.n)}` : "") + (r.src ? `<span class="src">${esc(r.src)}</span>` : ""));
    });
    return [`<span><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="none" stroke="var(--ink-2)" stroke-width="2"/></svg>${esc(v.from_label)}</span>`,
            `<span><svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="var(--ink-2)"/></svg>${esc(v.to_label)}</span>`].concat(v.legend || []);
  };

  // Game-by-game dots in date order, split into phases (e.g. non-conference, Big 12), each phase with
  // its average drawn as a line across its games. v.games: [{label, value, phase, tip}],
  // v.phases: [{name, avg, tone}], v.fmt, v.ylabel, v.domain
  R.gamedots = function (v, host, W, ctx) {
    const narrow = W < 560, top = 46, bottom = 34, left = 48, right = narrow ? 8 : 70, Hh = narrow ? 300 : 360;
    const svg = S("svg", { viewBox: `0 0 ${W} ${Hh}`, role: "img", "aria-label": v.aria || "" }, host);
    // group by phase (in the order given), keeping date order inside each phase
    const order = v.phases.map((p) => p.name);
    v = { ...v, games: v.games.map((g, i) => ({ ...g, _i: i })).sort((a, b) => order.indexOf(a.phase) - order.indexOf(b.phase) || a._i - b._i) };
    const vals = v.games.map((g) => g.value);
    const [d0, d1] = v.domain || domainOf(vals, 0.08);
    const y = lin(d0, d1, Hh - bottom, top), n = v.games.length;
    const x = (i) => left + (i + 0.5) * (W - left - right) / n;
    for (const t of ticks(d0, d1, 4)) {
      S("line", { class: "grid", x1: left, x2: W - right, y1: y(t), y2: y(t) }, svg);
      T(svg, left - 8, y(t) + 4, fmt(t, { dec: v.fmt?.tickDec ?? 0, suffix: v.fmt?.suffix || "" }), { "text-anchor": "end", class: "muted" });
    }
    if (v.ylabel) T(svg, 0, 14, v.ylabel, { "text-anchor": "start", class: "axis-title" });
    for (const ph of v.phases) {
      const idx = v.games.map((g, i) => (g.phase === ph.name ? i : -1)).filter((i) => i >= 0);
      if (!idx.length) continue;
      const x0 = x(idx[0]) - (W - left - right) / n / 2, x1 = x(idx[idx.length - 1]) + (W - left - right) / n / 2;
      S("rect", { x: x0, y: top - 10, width: x1 - x0, height: Hh - bottom - top + 10, style: `fill:${color(ph.tone)};opacity:.06` }, svg);
      T(svg, (x0 + x1) / 2, top - 16, (ph.label || ph.name) + (narrow ? " · avg " + fmt(ph.avg, v.fmt || { dec: 1 }) : ""), { "text-anchor": "middle", class: "axis-title", style: `fill:${color(ph.tone)}` });
      S("line", { x1: x0 + 4, x2: x1 - 4, y1: y(ph.avg), y2: y(ph.avg), style: `stroke:${color(ph.tone)};stroke-width:3` }, svg);
      if (!narrow) T(svg, x1 + 6, y(ph.avg) + 5, "avg " + fmt(ph.avg, v.fmt || { dec: 1 }), { "text-anchor": "start", class: "val", style: `fill:${color(ph.tone)}` });
    }
    v.games.forEach((gm, i) => {

  };

    };
    if (b.select || b.views.some((v) => hasKeys(v))) { ctr.appendChild(chip); hlListeners.push(syncChip); syncChip(); }
    const tb = el("button", { class: "tbl-btn", type: "button" }, "Show the numbers");
    tb.addEventListener("click", () => { state.table = !state.table; tb.textContent = state.table ? "Show the chart" : "Show the numbers"; draw(); });
    // only offer the numbers when there is a table that differs from what's already shown
    ctr.appendChild(tb);
    fig.append(plot, legend, caption);
    function draw() {
      plot.innerHTML = ""; legend.innerHTML = "";
      const v = b.views[state.view];
      // only offer the numbers when this view has a table that differs from what's already shown
      const hasTable = !!(v.table || b.table) && v.type !== "table";
      tb.style.display = hasTable ? "" : "none";
      if (!hasTable && state.table) { state.table = false; tb.textContent = "Show the numbers"; }
      caption.innerHTML = fill(v.caption || "");
      caption.style.display = v.caption ? "" : "none";
      if (state.table) { plot.appendChild(table(v.table || b.table)); legend.style.display = "none"; return; }
      const W = Math.max(280, plot.clientWidth);
      const items = R[v.type](v, plot, W, { hero }) || [];
      legend.innerHTML = items.join("");
      legend.style.display = items.length ? "" : "none";
    }
    fig.appendChild(el("p", { class: "takeaway" }, fill(b.takeaway)));
    if (b.careful) fig.appendChild(el("p", { class: "careful" }, `<b>Careful</b>${fill(b.careful)}`));
    const extra = [b.reading ? `<p>${fill(b.reading)}</p>` : "", b.select && b.select.hint ? `<p>${esc(b.select.hint)}</p>` : "",
                   b.technical ? `<p>${fill(b.technical)}</p>` : ""].join("");
    if (extra) {
      const d = el("details", { class: "more" });
      d.appendChild(el("summary", {}, "How to read this chart"));
      d.insertAdjacentHTML("beforeend", extra);
      fig.appendChild(d);
    }
    figures.push(draw);
    return fig;
  }
  const hasKeys = (v) => (v.rows || v.points || []).some((r) => r.key) || (v.panels || []).some(hasKeys);

  // A sourced list (exhibition results, media takes): each item is a line of text plus a link.
  function listBlock(b) {
    const fig = el("figure", { class: "chart listfig" });
    fig.appendChild(el("p", { class: "fig-no" }, esc(b.label || "")));
    fig.appendChild(el("div", { class: "chart-head" }, `<h3>${fill(b.title)}</h3>`));
    const ul = el("ul", { class: "srclist" });
    for (const it of b.items) {
      const li = el("li");
      li.innerHTML = `${it.head ? `<span class="srchead">${esc(it.head)}</span>` : ""}<span class="srctext">${esc(it.text)}</span>` +
        (it.url ? `<a class="srclink" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.source || "Source")}</a>` : "");
      ul.appendChild(li);
    }
    fig.appendChild(ul);
    if (b.takeaway) fig.appendChild(el("p", { class: "takeaway" }, fill(b.takeaway)));
    if (b.careful) fig.appendChild(el("p", { class: "careful" }, `<b>Careful</b>${fill(b.careful)}`));
    return fig;
  }

  function picker(sel) {
    const id = "pick-" + Math.random().toString(36).slice(2, 8);
    const wrap = el("label", { class: "picker" });
    wrap.appendChild(el("span", {}, esc(sel.label)));
    const input = el("input", { type: "search", list: id, placeholder: sel.placeholder || "Type a name", autocomplete: "off" });
    const dl = el("datalist", { id });
    const byLabel = new Map();
    for (const o of sel.options) { dl.appendChild(el("option", { value: o.label })); byLabel.set(o.label.toLowerCase(), o); }
    const go = () => {
      const o = byLabel.get(input.value.trim().toLowerCase());
      if (o && H.key !== o.key) setHighlight(o.key, o.name || o.label);
    };
    input.addEventListener("change", go);
    input.addEventListener("input", go);
    hlListeners.push(() => { if (!H.key) input.value = ""; });
    wrap.append(input, dl);
    return wrap;
  }

  function table(t) {
    const wrap = el("div", { class: "table-scroll" });
    if (!t) { wrap.textContent = "No table for this view."; return wrap; }
    const tab = el("table", { class: "data" });
    const thead = el("tr");
    for (const c of t.columns) thead.appendChild(el("th", { class: c.num ? "num" : "" }, esc(c.label)));
    tab.appendChild(el("thead")).appendChild(thead);
    const tbody = el("tbody");
    for (const r of t.rows) {
      const tr = el("tr", { class: r._focus ? "focus" : "" });
      for (const c of t.columns) tr.appendChild(el("td", { class: c.num ? "num" : "" }, esc(r[c.key] === null || r[c.key] === undefined ? "–" : minus(String(r[c.key])))));
      tbody.appendChild(tr);
    }
    tab.appendChild(tbody);
    wrap.appendChild(tab);
    return wrap;
  }

  // ---- page ------------------------------------------------------------------------------
  const LOGO = '<svg viewBox="0 -0.8 334.3 126.0" role="img" aria-hidden="true"><path fill-rule="evenodd" d="M0,0 H40.9 C51.70,0.00 58.90,10.40 58.90,26.00 V98.1 C58.90,113.70 50.90,124.10 38.90,124.10 H0 Z M26.2,25.3 H29.3 Q32.3,25.3 32.3,28.3 V95.1 Q32.3,98.1 29.3,98.1 H26.2 Z M70.45,0 H105.25 L116.95,124.1 H93.35 L91.55,102.9 H83.25 L81.55,124.1 H59.25 Z M87.45,43 L90.35,77.3 H84.55 Z M110.15,0 H133.35 L136.65,50.8 L140.85,0 H160.9 L164.65,52.4 L167.8,0 H190.25 L180.65,124.1 H156.15 L150.65,77.1 L145.15,124.1 H120.45 Z M189.9,23.2 C189.90,8.98 196.70,-0.50 206.90,-0.50 H228.9 C239.10,-0.50 245.90,8.98 245.90,23.20 V45.1 H220.5 V27.1 A2.6,2.6 0 0 0 215.3,27.1 V96.9 A2.6,2.6 0 0 0 220.5,96.9 V76.3 H217.8 V52.3 H245.9 V124.1 H229.9 V119.2 C229.9,122.6 225.2,124.6 217.5,124.6 H206.9 C196.70,124.60 189.90,115.24 189.90,101.20 Z"/>       <path fill="#2F64C0" d="M246.2,0.00 H334.28 L323.16,37.57 H252.2 V19.6 C252.2,12 248.6,4 246.2,0.00 Z"/>       <path fill="#F5C030" d="M252.2,43.27 H321.47 L310.35,80.83 H252.2 Z"/>       <path fill="#E5463A" d="M252.2,86.53 H308.67 L297.55,124.10 H252.2 Z"/></svg>';

  function topbar(right) {
    const t = el("header", { class: "mast" });
    const w = el("div", { class: "wrap" });
    w.appendChild(el("a", { class: "brand", href: "index.html", "aria-label": "DAWG Hoops research briefs" },
      LOGO + '<span class="descriptor">College Basketball</span>'));
    if (right) w.appendChild(el("span", { class: "top-right" }, esc(right)));
    t.appendChild(w);
    return t;
  }
  function sechead(kicker, title, note) {
    const h = el("div", { class: "sechead" });
    const l = el("div");
    l.appendChild(el("span", { class: "kicker" }, esc(kicker)));
    l.appendChild(el("h2", {}, esc(title)));
    h.appendChild(l);
    if (note) h.appendChild(el("p", { class: "sechead-note" }, fill(note)));
    return h;
  }

  async function copyText(txt) {
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(txt); return true; } } catch (e) { /* fall through */ }
    const ta = el("textarea", { style: "position:fixed;top:-1000px;opacity:0" });
    ta.value = txt; document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }

  function page() {
    const app = document.getElementById("app");
    if (D.kind === "index") return indexPage(app);
    app.appendChild(topbar(D.topright || `Research brief ${D.id.toUpperCase()}`));
    const band = el("section", { class: "band" });
    const bw = el("div", { class: "wrap" });
    bw.appendChild(el("span", { class: "kicker" }, fill(D.question)));
    bw.appendChild(el("h1", { class: "verdict" }, fill(D.verdict)));
    bw.appendChild(el("p", { class: "answer" }, fill(D.answer)));
    const vd = el("div", { class: "verdicts" });
    for (const c of D.claims.filter((c) => c.headline)) {
      const s = el("span", { class: "verdict-item" });
      s.appendChild(badge(c));
      s.appendChild(el("span", {}, fill(c.short || c.text)));
      vd.appendChild(s);
    }
    vd.appendChild(el("a", { href: "#how-sure" }, "How sure?"));
    bw.appendChild(vd);
    band.appendChild(bw);
    app.appendChild(band);
    const wrap = el("div", { class: "wrap" });
    app.appendChild(wrap);
    wrap.appendChild(figure(D.hero, true));

    if (D.blocks.length) {
      const s = el("section", { class: "block", id: "evidence" });
      s.appendChild(sechead(D.evidence_kicker || "Supporting charts", D.evidence_title || "The evidence", "Hover any mark for exact values and where they come from."));
      const figs = el("div", { class: "figs" });
      for (const b of D.blocks) figs.appendChild(b.kind === "list" ? listBlock(b) : figure(b, false));
      s.appendChild(figs);
      wrap.appendChild(s);
    }

    if (D.next.length) {
      const s = el("section", { class: "block explore", id: "explore" });
      s.appendChild(sechead("Keep going", "Ask next", "Each can be answered from data DAWG Hoops already has. Copy one and ask Claude."));
      const o = el("ol", { class: "next" });
      for (const n of D.next) {
        const li = el("li");
        li.appendChild(el("span", { class: "q" }, fill(n.q)));
        const btn = el("button", { type: "button" }, "Copy");
        btn.addEventListener("click", async () => {
          const ok = await copyText(li.querySelector(".q").textContent);
          btn.textContent = ok ? "Copied" : "Select to copy";
          btn.classList.toggle("done", ok);
          setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("done"); }, 1800);
        });
        li.appendChild(btn);
        o.appendChild(li);
      }
      s.appendChild(o);
      wrap.appendChild(s);
    }

    const sure = el("section", { class: "block", id: "how-sure" });
    sure.appendChild(sechead("Evidence check", "How sure?", "How confident to be in each claim. Hover a label for why."));
    const ul = el("ul", { class: "claims" });
    for (const c of D.claims) {
      const li = el("li");
      li.appendChild(el("span", {}, "")).appendChild(badge(c));
      li.appendChild(el("span", {}, fill(c.text)));
      ul.appendChild(li);
    }
    sure.appendChild(ul);
    if (D.limits.length) {
      sure.appendChild(el("h3", { class: "sub" }, "What this can\u2019t tell you"));
      const l = el("ul", { class: "limits" });
      for (const i of D.limits) l.appendChild(el("li", {}, fill(i)));
      sure.appendChild(l);
    }
    wrap.appendChild(sure);
    wrap.appendChild(methodSection());
    redraw();
    reveal();
  }

  function methodSection() {
    const d = el("details", { class: "method" });
    d.appendChild(el("summary", {}, "Method and sources"));
    d.appendChild(el("p", { class: "meta" }, `<span><b>Sample</b> ${fill(D.sample)}</span><span><b>Data</b> ${esc(D.data_through)}</span><span><b>Method</b> ${esc(D.provenance.method_version)}</span>`));
    for (const p of D.method || []) d.appendChild(el("p", {}, fill(p)));
    d.appendChild(el("h4", {}, "Results files"));
    d.appendChild(el("p", {}, "Every number on this page is read from these saved results; nothing is computed in the page. The brief renders only when each file matches the current data and method versions."));
    d.appendChild(table({ columns: [{ key: "file", label: "Results file" }, { key: "dv", label: "Data version" }, { key: "mv", label: "Method" }, { key: "at", label: "Computed (UTC)" }],
      rows: D.provenance.sources.map((s) => ({ file: s.file, dv: typeof s.data_version === "object" ? Object.entries(s.data_version).map(([k, v]) => `${k}: ${v}`).join(", ") : s.data_version, mv: s.method_version, at: (s.computed_utc || "").replace("T", " ").replace("+00:00", "") })) }));
    d.appendChild(el("h4", {}, `Every number in the text (${Object.keys(D.facts).length})`));
    d.appendChild(table({ columns: [{ key: "k", label: "Fact" }, { key: "v", label: "Shown as" }, { key: "s", label: "Source" }],
      rows: Object.entries(D.facts).map(([k, v]) => ({ k, v: v.display, s: v.source })) }));
    d.appendChild(el("p", {}, `Rendered ${esc(D.provenance.rendered_utc.replace("T", " ").replace("+00:00", " UTC"))}. Re-render with <code>python3 briefs/render.py</code>.`));
    return d;
  }

  function indexPage(app) {
    app.appendChild(topbar("Research briefs"));
    const band = el("section", { class: "band" });
    const bw = el("div", { class: "wrap" });
    bw.appendChild(el("span", { class: "kicker" }, "DAWG Hoops"));
    bw.appendChild(el("h1", { class: "verdict" }, "Research briefs"));
    bw.appendChild(el("p", { class: "answer" }, "Finished investigations, drawn from saved, version-checked results."));
    band.appendChild(bw);
    app.appendChild(band);
    const wrap = el("div", { class: "wrap" });
    const ul = el("ul", { class: "index-list" });
    for (const b of D.briefs) {
      const li = el("li");
      li.innerHTML = `<a href="${esc(b.file)}"><div class="q">${esc(b.question)}</div><div class="a">${esc(b.verdict)}</div><span class="go">Open brief</span></a>`;
      ul.appendChild(li);
    }
    wrap.appendChild(ul);
    app.appendChild(wrap);
  }

  function reveal() {
    const items = [...document.querySelectorAll(".reveal")];
    if (!("IntersectionObserver" in window)) { items.forEach((i) => i.classList.add("in")); return; }
    const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -8% 0px" });
    items.forEach((i) => io.observe(i));
  }

  let rt, lastW = innerWidth;
  function redraw() { figures.forEach((d) => d()); }
  addEventListener("resize", () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rt); rt = setTimeout(redraw, 120); });
  page();
})();
</script>
